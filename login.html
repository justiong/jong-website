<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — JONG</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-brand"><h1>JONG</h1><p>Your throne awaits.</p></div>
    <form class="auth-form" method="post">
      <h2>Sign In</h2>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="you@jong.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary">Access Account</button>
      <p class="auth-switch">New to JONG? <a href="register.html">Create Account</a></p>
    </form>
  </div>
</body>
</html>
